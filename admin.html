<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NTG Admin Login</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;padding:30px}
.card{max-width:500px;margin:50px auto;background:white;padding:25px;border-radius:16px;box-shadow:0 5px 20px #0002}
h1{color:#12345b}input,button{width:100%;padding:14px;margin-top:10px;border-radius:9px;font-size:16px}
input{border:1px solid #ccc}button{border:0;background:#0756a5;color:white;font-weight:bold}
#msg{margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h1>🔐 NTG Admin Login</h1>
<p>Narsingdi Travel Group</p>
<label>Admin Password</label>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="msg"></div>
</div>
<script>
async function login(){
 const msg=document.getElementById('msg');
 const password=document.getElementById('password').value;
 msg.textContent='Checking...';
 try{
  const r=await fetch('/api/admin/login',{
   method:'POST',
   credentials:'include',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({password})
  });
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'Login failed');
  msg.style.color='green';
  msg.textContent='Login successful...';
  location.href='/admin-dashboard.html';
 }catch(e){
  msg.style.color='red';
  msg.textContent='❌ '+e.message;
 }
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
